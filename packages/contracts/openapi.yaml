openapi: 3.1.0
info:
  title: Momentos API
  version: 0.0.4
  description: |
    MVP contracts — Moment, Cut, Asset, Song Pick, jobs.
    Cut is the sole persisted edit plan (no master_timeline).
    Render jobs carry Moment reflectionQuestion for the Act 1 prompt banner
    (not duplicated onto Cut clips).

    **Auth (mobile → gateway):** `Authorization: Bearer <supabase_access_token>`.
    Gateway verifies JWT, overwrites `X-Momentos-Principal` with `sub`, and calls
    peers with `Authorization: Bearer <INTERNAL_SERVICE_TOKEN>`.

    **Extensions (moment-api workstream):** Idempotency-Key on create; BFF aggregate
    fields on GET Moment (`assets`, nested `cut`); internal job claim/complete
    routes on moment-service (not exposed via gateway).
servers:
  - url: http://localhost:8080
    description: gateway (mobile-facing)
  - url: http://localhost:8081
    description: moment-service (internal peers / workers)
paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK

  /v1/assets:
    post:
      summary: Create pending Asset + signed upload URL
      operationId: createAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, mimeType, byteSize]
              properties:
                type:
                  $ref: "#/components/schemas/AssetType"
                mimeType:
                  type: string
                byteSize:
                  type: integer
                durationMs:
                  type: integer
    get:
      summary: List Assets by ids
      operationId: listAssets
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
            description: Comma-separated Asset UUIDs
        - name: sign
          in: query
          schema:
            type: boolean
  /v1/assets/{assetId}:
    get:
      summary: Get Asset
      operationId: getAsset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /v1/assets/{assetId}/complete:
    post:
      summary: Complete Asset upload
      operationId: completeAsset
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /v1/song-picks:
    get:
      summary: List Song Picks
      operationId: listSongPicks
  /v1/song-picks/{songPickId}:
    get:
      summary: Get Song Pick (optional signed Edit Audio URL)
      operationId: getSongPick
      parameters:
        - name: songPickId
          in: path
          required: true
          schema:
            type: string
        - name: sign
          in: query
          schema:
            type: boolean

  /v1/moments:
    get:
      summary: List Moments for the signed-in user
      operationId: listMoments
      responses:
        "200":
          description: |
            Moments for the signed-in user, newest first.
            Each item includes id, status, createdAt, and songPickId.
            renderUrl is optional.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Moment"
    post:
      summary: Create Moment from Week Intake
      operationId: createMoment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMomentRequest"
      responses:
        "201":
          description: Created (status drafting; cut-draft enqueued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moment"
        "409":
          description: Idempotency-Key reused with a different body
  /v1/moments/{momentId}:
    get:
      summary: Get Moment (gateway BFF aggregate)
      operationId: getMoment
      parameters:
        - $ref: "#/components/parameters/MomentId"
      responses:
        "200":
          description: |
            Lean Moment from moment-service; gateway may enrich with `assets`,
            nested `cut`, and signed `renderUrl` when ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moment"
  /v1/moments/{momentId}/cut:
    get:
      summary: Get Cut
      operationId: getCut
      parameters:
        - $ref: "#/components/parameters/MomentId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cut"
        "404":
          description: Cut not drafted yet
    patch:
      summary: Apply Editor changes to Cut / Asset ordering
      operationId: patchCut
      parameters:
        - $ref: "#/components/parameters/MomentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cut"

  # --- moment-service internal (workers; not on gateway) ---
  /v1/internal/jobs/claim:
    post:
      summary: Claim next queued job (SKIP LOCKED)
      operationId: claimJob
      description: Internal — Authorization Bearer INTERNAL_SERVICE_TOKEN
      security:
        - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimJobRequest"
      responses:
        "200":
          description: Claimed job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "204":
          description: No job available
  /v1/internal/jobs/{jobId}/complete:
    post:
      summary: Complete a claimed job (success or failure)
      operationId: completeJob
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteJobRequest"
      responses:
        "200":
          description: Accepted
  /v1/internal/jobs/{jobId}/heartbeat:
    post:
      summary: Extend job lease while running
      operationId: heartbeatJob
      security:
        - InternalToken: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId]
              properties:
                workerId:
                  type: string
      responses:
        "200":
          description: Lease extended

components:
  securitySchemes:
    SupabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token (gateway)
    InternalToken:
      type: http
      scheme: bearer
      description: INTERNAL_SERVICE_TOKEN (service-to-service / workers)
  parameters:
    MomentId:
      name: momentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Deduplicate create Moment; same key + body returns original 201 body
  schemas:
    AssetType:
      type: string
      enum: [photo, video, voice]
    SongPick:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          example: live-a-life-you-will-remember
        title:
          type: string
        platformSongId:
          type: string
          description: Instagram/Meta music id when known
    AssetRef:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AssetType"
        thumbnailUrl:
          type: string
          format: uri
        durationMs:
          type: integer
    CreateMomentRequest:
      type: object
      required: [assetIds, reflectionAssetId, reflectionQuestion]
      properties:
        assetIds:
          type: array
          maxItems: 20
          minItems: 1
          items:
            type: string
            format: uuid
          description: Week Intake Assets including the Reflection (cap 20 total)
        reflectionAssetId:
          type: string
          format: uuid
          description: Asset used as the Reflection (must be one of assetIds; voice or talking-head video)
        reflectionQuestion:
          type: string
          minLength: 1
          description: Prompt the user answered in their Reflection
        songPickId:
          type: string
          default: live-a-life-you-will-remember
    Moment:
      type: object
      required: [id, status, songPick, assetIds]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [intake, drafting, rendering, ready, failed]
        createdAt:
          type: string
          format: date-time
        songPickId:
          type: string
        songPick:
          $ref: "#/components/schemas/SongPick"
        assetIds:
          type: array
          items:
            type: string
            format: uuid
        reflectionAssetId:
          type: string
          format: uuid
        reflectionQuestion:
          type: string
        assets:
          type: array
          description: BFF-only enrichment (gateway GET)
          items:
            $ref: "#/components/schemas/AssetRef"
        cutId:
          type: string
          format: uuid
        cut:
          description: BFF-only nested Cut when drafted
          $ref: "#/components/schemas/Cut"
        renderUrl:
          type: string
          format: uri
        renderStorageKey:
          type: string
          description: Internal/storage key; gateway may sign into renderUrl
        errorCode:
          type: string
        errorMessage:
          type: string
    CutClipRole:
      type: string
      enum: [reflection, montage, hero_outro]
    CutClipAct:
      type: integer
      enum: [1, 2, 3]
      description: Act segment (1 Reflection hook, 2 montage, 3 hero look)
    CutMotionPreset:
      type: string
      enum: [hook_slow_push, whip_punch_in, handheld_super8_drift, native_action_crop]
      description: Camera Motion Preset; required on picture clips; omit for voice-only Reflection slate
    CutVisualStyle:
      type: string
      enum: [clean_916, super8_gate]
    CutTransitionIn:
      type: string
      enum: [none, hard_cut, white_flash]
    CutCaption:
      type: object
      required: [text, startMs, endMs]
      properties:
        text:
          type: string
        startMs:
          type: integer
        endMs:
          type: integer
    CutMarkerType:
      type: string
      enum: [j_cut, chorus_drop, flash, sfx]
    CutMarker:
      type: object
      required: [type, atMs]
      properties:
        type:
          $ref: "#/components/schemas/CutMarkerType"
        atMs:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: Optional marker-specific data (e.g. system media id)
    Cut:
      type: object
      required: [id, momentId, version, clips]
      description: |
        Sole persisted edit plan. Must include at least one clip with role hero_outro
        on a legal 4-beat span for this product slice. No master_timeline field.
      properties:
        id:
          type: string
          format: uuid
        momentId:
          type: string
          format: uuid
        version:
          type: integer
        songPickId:
          type: string
        clips:
          type: array
          items:
            type: object
            required: [assetId, order, role, act, visualStyle, transitionIn]
            properties:
              assetId:
                type: string
                format: uuid
              order:
                type: integer
              startMs:
                type: integer
              endMs:
                type: integer
              sourceInMs:
                type: integer
                description: Inclusive file offset in ms. Conceptually 0 when omitted. Photos are not file seeks.
              sourceOutMs:
                type: integer
                description: Exclusive file offset in ms. For video and voice, sourceOutMs - sourceInMs is the clip duration.
              role:
                $ref: "#/components/schemas/CutClipRole"
              act:
                $ref: "#/components/schemas/CutClipAct"
              motionPreset:
                $ref: "#/components/schemas/CutMotionPreset"
              visualStyle:
                $ref: "#/components/schemas/CutVisualStyle"
              transitionIn:
                $ref: "#/components/schemas/CutTransitionIn"
        captions:
          type: array
          items:
            $ref: "#/components/schemas/CutCaption"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/CutMarker"
    EditorPatch:
      type: object
      properties:
        reorderAssetIds:
          type: array
          items:
            type: string
            format: uuid
        replace:
          type: object
          properties:
            fromAssetId:
              type: string
              format: uuid
            toAssetId:
              type: string
              format: uuid
        removeAssetId:
          type: string
          format: uuid
        reDraft:
          type: boolean
        reRender:
          type: boolean
        trims:
          type: array
          items:
            type: object
            required: [assetId, sourceInMs, sourceOutMs]
            properties:
              assetId:
                type: string
                format: uuid
              sourceInMs:
                type: integer
              sourceOutMs:
                type: integer
    ClaimJobRequest:
      type: object
      required: [jobType, workerId]
      properties:
        jobType:
          type: string
          enum: [cut-draft, render]
        workerId:
          type: string
    CompleteJobRequest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        errorCode:
          type: string
        errorMessage:
          type: string
        clips:
          type: array
          description: cut-draft success — clip list (service assigns Cut id/version)
          items:
            type: object
        cut:
          $ref: "#/components/schemas/Cut"
        songPickId:
          type: string
        renderStorageKey:
          type: string
        renderUrl:
          type: string
          format: uri
    RenderJobPayload:
      type: object
      description: |
        moment-service → render-service job payload. Act 1 prompt banner text is
        reflectionQuestion from the Moment (ADR 0020); not stored on Cut clips.
      properties:
        jobType:
          type: string
          enum: [render]
        jobId:
          type: string
          format: uuid
        momentId:
          type: string
          format: uuid
        cutVersion:
          type: integer
        cut:
          $ref: "#/components/schemas/Cut"
        songPickId:
          type: string
        editAudioUrl:
          type: string
          format: uri
        reflectionQuestion:
          type: string
          description: Act 1 prompt banner text from the Moment
        assets:
          type: array
          items:
            type: object
    Job:
      type: object
      required: [id, momentId, jobType, status, attempt, payload]
      properties:
        id:
          type: string
          format: uuid
        momentId:
          type: string
          format: uuid
        jobType:
          type: string
          enum: [cut-draft, render]
        status:
          type: string
          enum: [queued, running, succeeded, failed, superseded]
        attempt:
          type: integer
        payload:
          type: object
          additionalProperties: true
          description: |
            cut-draft or render payload. For jobType=render, see RenderJobPayload
            (includes reflectionQuestion for the Act 1 banner).
        cutVersion:
          type: integer
        claimedBy:
          type: string
        leaseUntil:
          type: string
          format: date-time
security:
  - SupabaseJWT: []
