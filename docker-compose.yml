services:
  postgres:
    image: postgres:16-alpine
    container_name: momentos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: momentos
    volumes:
      - momentos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d momentos"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  momentos_pg:
