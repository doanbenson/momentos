[project]
name = "momentos-ml"
version = "0.0.1"
description = "Cut drafting agents for Momentos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "librosa>=0.10.2",
  "soundfile>=0.12.1",
  "numpy>=1.26,<2.3",
  "scipy>=1.11",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["momentos_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
